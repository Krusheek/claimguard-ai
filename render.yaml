services:
  - type: web
    name: claimguard-ai-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: claimguard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: DEBUG
        value: "false"
      - key: OPENAI_API_KEY
        sync: false   # Set manually in Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false   # Set manually in Render dashboard
      - key: VLM_PROVIDER
        value: openai

databases:
  - name: claimguard-db
    region: singapore
    plan: free
    databaseName: claimguard
    user: claimguard
